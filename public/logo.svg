<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Espresso to Rich Dark Toast -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b2216" />
      <stop offset="50%" stop-color="#301b11" />
      <stop offset="100%" stop-color="#211109" />
    </linearGradient>

    <!-- Terracotta Coral Gradient -->
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87158" />
      <stop offset="60%" stop-color="#e05d44" />
      <stop offset="100%" stop-color="#ba3921" />
    </linearGradient>

    <!-- Warm Cream Gradient -->
    <linearGradient id="creamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5eee3" />
    </linearGradient>

    <!-- Gold Accent Spark Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Soft Ambient Layer Drop Shadows -->
    <filter id="layerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.32" />
    </filter>

    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Squircle Tile -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#bgGrad)" stroke="#5c3e2c" stroke-width="2.5" />

  <!-- Subtle Inner Specular Highlight Ring -->
  <rect x="8.5" y="8.5" width="103" height="103" rx="25.5" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />

  <!-- Layer 1: Schema Specification Layer (Warm Cream) -->
  <g filter="url(#layerShadow)">
    <!-- Top Face -->
    <path d="M 33 46 L 60 30 L 87 46 L 60 62 Z" fill="url(#creamGrad)" />
    <!-- Left Bevel -->
    <path d="M 33 46 L 60 62 L 60 68 L 33 52 Z" fill="#ede5d8" />
    <!-- Right Bevel -->
    <path d="M 87 46 L 60 62 L 60 68 L 87 52 Z" fill="#ded3c3" />
    <!-- Dynamic Grid Lines on Cream Layer -->
    <line x1="46" y1="38" x2="74" y2="54" stroke="#362117" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.28" />
    <line x1="40" y1="46" x2="68" y2="62" stroke="#362117" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.18" />
  </g>

  <!-- Layer 2: Dynamic Execution Layer (Terracotta Coral) -->
  <g filter="url(#layerShadow)">
    <!-- Top Face -->
    <path d="M 33 66 L 60 50 L 87 66 L 60 82 Z" fill="url(#terracottaGrad)" />
    <!-- Left Bevel -->
    <path d="M 33 66 L 60 82 L 60 89 L 33 73 Z" fill="#9e2e1b" />
    <!-- Right Bevel -->
    <path d="M 87 66 L 60 82 L 60 89 L 87 73 Z" fill="#782314" />
    <!-- Dynamic Component Matrix Lines on Terracotta Layer -->
    <line x1="46" y1="58" x2="74" y2="74" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.6" />
    <line x1="40" y1="66" x2="68" y2="82" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.4" />
  </g>

  <!-- Lightning Dynamic Spark (Top Right) -->
  <g transform="translate(86, 24)" filter="url(#starGlow)">
    <path d="M 0 -9 Q 0 0 9 0 Q 0 0 0 9 Q 0 0 -9 0 Q 0 0 0 -9 Z" fill="url(#amberGrad)" />
    <circle cx="0" cy="0" r="2.8" fill="#ffffff" />
  </g>
</svg>
